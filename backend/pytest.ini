[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
addopts = -q

# Test-only secrets set BEFORE Django settings load (via pytest-env plugin).
# These are NOT production credentials — safe to commit.
# ENCRYPTION_KEY below is a valid Fernet key derived from an all-zeros input.
# To regenerate: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
env =
    ENCRYPTION_KEY=dGVzdC1vbmx5LWZlcm5ldC1rZXktbm90LXNlY3JldC0=
    SECRET_KEY=test-only-django-secret-key-change-in-production
